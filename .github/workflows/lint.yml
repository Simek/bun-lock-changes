name: '🔍️ Lint Code'
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint and format checks
    steps:
      - name: '🚚 Checkout'
        uses: actions/checkout@v7
      - name: '🔧 Setup Bun'
        uses: oven-sh/setup-bun@v2
      - name: '📦️ Install dependencies'
        run: bun install
      - name: '🔍️ Run lint and format checks'
        run: bun lint
